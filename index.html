<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>UPBRAINROTS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{

    background:
    radial-gradient(
        circle at 20% 20%,
        rgba(0,255,255,.12),
        transparent 30%
    ),
    radial-gradient(
        circle at 80% 80%,
        rgba(0,80,255,.18),
        transparent 35%
    ),
    #030611;

    color:#eef7ff;

    font-family:
    Arial,
    sans-serif;

    overflow-x:hidden;
}

/* НЕОНОВЫЕ БОКОВЫЕ ЭФФЕКТЫ */

body:before,
body:after{

    content:"";

    position:fixed;

    width:260px;
    height:260px;

    border-radius:50%;

    filter:blur(70px);

    opacity:.45;

    pointer-events:none;

    z-index:-1;

}

body:before{

    background:#00eaff;

    left:-170px;
    top:20%;

}

body:after{

    background:#0066ff;

    right:-170px;
    bottom:15%;

}

/* GRID */

body{

    background-image:

    linear-gradient(
        rgba(0,230,255,.035) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(0,230,255,.035) 1px,
        transparent 1px
    );

    background-size:35px 35px;

}

/* APP */

.app{

    max-width:480px;

    margin:auto;

    padding:12px 12px 30px;

}

/* TOP */

.top{

    position:relative;

    overflow:hidden;

    background:
    linear-gradient(
        145deg,
        rgba(13,26,55,.96),
        rgba(5,12,30,.96)
    );

    border:1px solid rgba(0,220,255,.25);

    border-radius:28px;

    padding:20px;

    box-shadow:
    0 0 30px rgba(0,180,255,.12),
    inset 0 0 30px rgba(0,180,255,.04);

}

.top:after{

    content:"";

    position:absolute;

    width:180px;
    height:180px;

    background:#00eaff;

    filter:blur(100px);

    opacity:.12;

    right:-100px;
    top:-100px;

}

.logo{

    text-align:center;

    font-size:25px;

    font-weight:1000;

    letter-spacing:3px;

    color:#fff;

    text-shadow:
    0 0 8px #00eaff,
    0 0 25px #0066ff;

}

.balance{

    text-align:center;

    font-size:34px;

    font-weight:1000;

    color:#ffd83d;

    margin-top:8px;

    text-shadow:
    0 0 12px rgba(255,216,61,.5);

}

.bonus{

    width:100%;

    border:0;

    border-radius:16px;

    padding:14px;

    margin-top:14px;

    background:
    linear-gradient(
        135deg,
        #00eaff,
        #0066ff
    );

    color:white;

    font-size:15px;

    font-weight:900;

    box-shadow:
    0 0 18px rgba(0,190,255,.25);

    transition:.15s;

}

button{

    cursor:pointer;

}

button:active{

    transform:scale(.96);

}

/* TABS */

.tabs{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:12px 2px;

    scrollbar-width:none;

}

.tabs::-webkit-scrollbar{

    display:none;

}

.tab{

    flex:0 0 auto;

    padding:12px 14px;

    border-radius:16px;

    background:#0b142b;

    border:1px solid #20345c;

    color:#91a8cf;

    font-weight:800;

    transition:.2s;

}

.tab.active{

    color:#fff;

    border-color:#00eaff;

    box-shadow:
    0 0 14px rgba(0,220,255,.25);

    background:
    linear-gradient(
        135deg,
        #0d2940,
        #0b1833
    );

}

/* SCREENS */

.screen{

    display:none;

}

.screen.active{

    display:block;

    animation:
    screenIn .25s ease;

}

@keyframes screenIn{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* SECTION */

.section{

    background:
    linear-gradient(
        145deg,
        rgba(12,22,45,.97),
        rgba(5,12,27,.97)
    );

    border:1px solid #1b3158;

    border-radius:24px;

    padding:16px;

    margin-bottom:14px;

    box-shadow:
    0 10px 35px rgba(0,0,0,.2);

}

/* SHOP */

.shop-grid{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:10px;

}

.card{

    background:#0c1730;

    border:1px solid #203962;

    border-radius:20px;

    padding:12px;

    transition:.2s;

}

.card:hover{

    transform:translateY(-2px);

    border-color:#00dfff;

    box-shadow:
    0 0 15px rgba(0,220,255,.15);

}

.img{

    height:80px;

    border-radius:16px;

    background:
    radial-gradient(
        circle,
        rgba(0,220,255,.12),
        transparent 60%
    ),
    #081126;

    display:grid;

    place-items:center;

    font-size:36px;

}

.price{

    margin-top:8px;

    color:#ffd83d;

    font-size:18px;

    font-weight:1000;

}

.buy,
.action{

    width:100%;

    padding:12px;

    border:0;

    border-radius:14px;

    margin-top:10px;

    color:white;

    font-weight:900;

    background:
    linear-gradient(
        135deg,
        #00dfff,
        #0066ff
    );

    box-shadow:
    0 0 12px rgba(0,190,255,.18);

}

/* INVENTORY */

.inventory-item{

    background:#0b1730;

    border:1px solid #203962;

    border-radius:17px;

    padding:12px;

    margin-top:9px;

}

/* UPGRADE */

.upgrade-circle{

    width:240px;

    height:240px;

    border-radius:50%;

    margin:20px auto;

    position:relative;

    display:grid;

    place-items:center;

    background:

    conic-gradient(
        #00ff91 0deg,
        #00ff91 180deg,
        #02050a 180deg,
        #02050a 360deg
    );

    box-shadow:
    0 0 35px rgba(0,255,145,.2);

}

.upgrade-circle:after{

    content:"";

    position:absolute;

    width:205px;

    height:205px;

    border-radius:50%;

    background:#050914;

    box-shadow:
    inset 0 0 30px rgba(0,0,0,.8);

}

.upgrade-percent{

    position:relative;

    z-index:2;

    font-size:38px;

    font-weight:1000;

    color:white;

    text-shadow:
    0 0 12px #00ff91;

}

.chances{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:8px;

}

.chance{

    padding:12px;

    text-align:center;

    border-radius:14px;

    border:1px solid #203962;

    background:#0b1730;

    color:#91a8cf;

    font-weight:900;

}

.chance.active{

    color:#00ff91;

    border-color:#00ff91;

    box-shadow:
    0 0 14px rgba(0,255,145,.2);

}

/* MINES */

.mines{

    display:grid;

    grid-template-columns:
    repeat(5,1fr);

    gap:8px;

}

.mine{

    aspect-ratio:1;

    border:1px solid #203962;

    border-radius:14px;

    background:#0b1730;

    display:grid;

    place-items:center;

    font-size:22px;

    transition:.2s;

}

.mine.open{

    background:
    radial-gradient(
        circle,
        rgba(0,255,145,.2),
        #07162a
    );

    border-color:#00ff91;

}

.mine.bomb{

    background:
    radial-gradient(
        circle,
        rgba(255,20,70,.3),
        #250811
    );

    border-color:#ff1744;

}

/* DICE */

.colors{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;

}

.color{

    padding:12px;

    text-align:center;

    border-radius:16px;

    background:#0b1730;

    border:1px solid #203962;

    transition:.2s;

}

.color.selected{

    border-color:#00eaff;

    box-shadow:
    0 0 18px rgba(0,220,255,.3);

    transform:scale(1.03);

}

.ball{

    width:50px;
    height:50px;

    border-radius:50%;

    margin:0 auto 8px;

}

.red{
    background:#ff1744;
    box-shadow:0 0 18px #ff1744;
}

.orange{
    background:#ff8a00;
    box-shadow:0 0 18px #ff8a00;
}

.yellow{
    background:#ffd600;
    box-shadow:0 0 18px #ffd600;
}

.green{
    background:#00ff3c;
    box-shadow:0 0 18px #00ff3c;
}

.blue{
    background:#0066ff;
    box-shadow:0 0 18px #0066ff;
}

.purple{
    background:#a020f0;
    box-shadow:0 0 18px #a020f0;
}

/* SLOTS */

.reels{

    display:flex;

    justify-content:center;

    gap:9px;

    margin:20px 0;

}

.reel{

    width:76px;
    height:76px;

    display:grid;
    place-items:center;

    border-radius:18px;

    background:#f5f8ff;

    color:#111;

    font-size:40px;

}

.spin{

    animation:
    reelSpin .45s ease;

}

@keyframes reelSpin{

    0%{
        transform:translateY(-15px);
        opacity:.4;
    }

    100%{
        transform:translateY(0);
        opacity:1;
    }

}

/* MESSAGE */

.msg{

    text-align:center;

    margin-top:12px;

    color:#91a8cf;

    min-height:20px;

}

/* LOADING */

.loading{

    position:fixed;

    inset:0;

    background:#030611;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:100;

    transition:.3s;

}

.loading.hide{

    opacity:0;

    pointer-events:none;

}

.loader{

    text-align:center;

    color:#00eaff;

    font-weight:1000;

    text-shadow:0 0 15px #00eaff;

}

.loader-circle{

    width:50px;
    height:50px;

    border-radius:50%;

    border:4px solid #12304c;

    border-top-color:#00eaff;

    animation:
    load 1s linear infinite;

    margin:auto auto 15px;

}

@keyframes load{

    to{
        transform:rotate(360deg);
    }

}

</style>

</head>

<body>

<div class="loading" id="loading">

    <div class="loader">

        <div class="loader-circle"></div>

        Загрузка UPBRAINROTS...

    </div>

</div>

<div class="app">

    <div class="top">

        <div class="logo">
            🧠 UPBRAINROTS
        </div>

        <div class="balance">
            <span id="balance">0</span> 🧠
        </div>

        <button
            class="bonus"
            onclick="dailyBonus()"
        >
            🎁 Получить 3 мозга
        </button>

    </div>

    <div class="tabs">

        <div
            class="tab active"
            data-screen="shop"
        >
            🛒 Магазин
        </div>

        <div
            class="tab"
            data-screen="inventory"
        >
            🎒 Инвентарь
        </div>

        <div
            class="tab"
            data-screen="upgrade"
        >
            ⚡ Апгрейд
        </div>

        <div
            class="tab"
            data-screen="mines"
        >
            💣 Мины
        </div>

        <div
            class="tab"
            data-screen="dice"
        >
            🎲 Dice
        </div>

        <div
            class="tab"
            data-screen="slots"
        >
            🎰 Слоты
        </div>

    </div>


    <!-- SHOP -->

    <div
        id="shop"
        class="screen active"
    >

        <div class="section">

            <h2>🧠 Брейнроты</h2>

            <div
                class="shop-grid"
                id="shopGrid"
            ></div>

        </div>

    </div>


    <!-- INVENTORY -->

    <div
        id="inventory"
        class="screen"
    >

        <div class="section">

            <h2>🎒 Инвентарь</h2>

            <div id="inventoryList"></div>

        </div>

    </div>


    <!-- UPGRADE -->

    <div
        id="upgrade"
        class="screen"
    >

        <div class="section">

            <h2>⚡ Upgrade</h2>

            <div
                class="upgrade-circle"
                id="upgradeCircle"
            >

                <div
                    class="upgrade-percent"
                    id="upgradePercent"
                >
                    50%
                </div>

            </div>

            <div class="chances">

                <div
                    class="chance"
                    onclick="selectChance(this,5)"
                >
                    5%
                </div>

                <div
                    class="chance"
                    onclick="selectChance(this,10)"
                >
                    10%
                </div>

                <div
                    class="chance"
                    onclick="selectChance(this,20)"
                >
                    20%
                </div>

                <div
                    class="chance"
                    onclick="selectChance(this,30)"
                >
                    30%
                </div>

                <div
                    class="chance"
                    onclick="selectChance(this,50)"
                >
                    50%
                </div>

                <div
                    class="chance active"
                    onclick="selectChance(this,75)"
                >
                    75%
                </div>

            </div>

            <input
                id="upgradeAmount"
                type="number"
                min="1"
                placeholder="Сколько поставить"
                style="
                width:100%;
                padding:13px;
                margin-top:12px;
                border-radius:14px;
                border:1px solid #203962;
                background:#071126;
                color:white;
                "
            >

            <button
                class="action"
                onclick="upgrade()"
            >
                ⚡ Запустить Upgrade
            </button>

            <div
                class="msg"
                id="upgradeMsg"
            ></div>

        </div>

    </div>


    <!-- MINES -->

    <div
        id="mines"
        class="screen"
    >

        <div class="section">

            <h2>💣 Mines</h2>

            <div
                class="mines"
                id="minesGrid"
            ></div>

            <button
                class="action"
                onclick="startMines()"
            >
                🎮 Новая игра
            </button>

            <div
                class="msg"
                id="minesMsg"
            ></div>

        </div>

    </div>


    <!-- DICE -->

    <div
        id="dice"
        class="screen"
    >

        <div class="section">

            <h2>🎲 Color Dice</h2>

            <div class="colors">

                <div
                    class="color"
                    onclick="selectColor(this,'red')"
                >
                    <div class="ball red"></div>
                    Красный
                </div>

                <div
                    class="color"
                    onclick="selectColor(this,'orange')"
                >
                    <div class="ball orange"></div>
                    Оранжевый
                </div>

                <div
                    class="color"
                    onclick="selectColor(this,'yellow')"
                >
                    <div class="ball yellow"></div>
                    Жёлтый
                </div>

                <div
                    class="color"
                    onclick="selectColor(this,'green')"
                >
                    <div class="ball green"></div>
                    Зелёный
                </div>

                <div
                    class="color"
                    onclick="selectColor(this,'blue')"
                >
                    <div class="ball blue"></div>
                    Синий
                </div>

                <div
                    class="color"
                    onclick="selectColor(this,'purple')"
                >
                    <div class="ball purple"></div>
                    Фиолетовый
                </div>

            </div>

            <input
                id="diceAmount"
                type="number"
                min="1"
                placeholder="Ставка"
                style="
                width:100%;
                padding:13px;
                margin-top:12px;
                border-radius:14px;
                border:1px solid #203962;
                background:#071126;
                color:white;
                "
            >

            <button
                class="action"
                onclick="rollDice()"
            >
                🎲 Бросить
            </button>

            <div
                class="msg"
                id="diceMsg"
            ></div>

        </div>

    </div>


    <!-- SLOTS -->

    <div
        id="slots"
        class="screen"
    >

        <div class="section">

            <h2>🎰 Слоты</h2>

            <div class="reels">

                <div
                    class="reel"
                    id="r1"
                >
                    🍒
                </div>

                <div
                    class="reel"
                    id="r2"
                >
                    ⭐
                </div>

                <div
                    class="reel"
                    id="r3"
                >
                    💎
                </div>

            </div>

            <button
                class="action"
                onclick="spin()"
            >
                🎰 Крутить
            </button>

            <div
                class="msg"
                id="slotMsg"
            ></div>

        </div>

    </div>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const initData = tg.initData;

const API_HEADERS = {

    "Content-Type":
    "application/json",

    "X-Telegram-Init-Data":
    initData

};


/* =====================================================
   API
===================================================== */

async function api(
    url,
    options={}
){

    const response =
        await fetch(
            url,
            {
                ...options,
                headers:{
                    ...API_HEADERS,
                    ...(options.headers || {})
                }
            }
        );

    const data =
        await response.json();

    if(!response.ok){

        throw new Error(
            data.error ||
            "Ошибка сервера"
        );

    }

    return data;

}


/* =====================================================
   PLAYER
===================================================== */

let balance = 0;

let inventory = [];


async function loadPlayer(){

    try{

        const data =
            await api(
                "/api/player"
            );

        balance =
            data.balance;

        inventory =
            data.inventory || [];

        render();

        document
            .getElementById("loading")
            .classList
            .add("hide");

    }catch(error){

        console.error(error);

        alert(
            "Не удалось подключиться к Telegram."
        );

    }

}


/* =====================================================
   RENDER
===================================================== */

function render(){

    document
        .getElementById("balance")
        .textContent =
        balance;

    const list =
        document.getElementById(
            "inventoryList"
        );

    if(!inventory.length){

        list.innerHTML =
            '<div class="msg">Инвентарь пуст</div>';

    }else{

        list.innerHTML =
            inventory
            .map(
                item => `
                <div class="inventory-item">

                    🧠 ${item.name}

                    <div
                        style="
                        color:#ffd83d;
                        margin-top:5px;
                        "
                    >
                        ${item.price} 🧠
                    </div>

                </div>
                `
            )
            .join("");

    }

}


/* =====================================================
   SHOP
===================================================== */

const ITEMS = {

    "La Secret Combinasion":45,
    "Garama And Madundung":50,
    "Burguro And Fryuro":63,
    "Cash Or Card":60,
    "Popcuru And Fizzuru":95,
    "Celestial Pegasus":150,
    "Capitano Moby":110,
    "Fragola La La La":75,
    "Cerberus":160,
    "Fortunu And Cashuru":185,
    "Cookie And Milki":195,
    "Spooky And Pumpky":200,
    "Reinito Sleighito":180,
    "Foxini Lanterini":350,
    "La Casa Boo":550,
    "Dragon Cannelloni":1670,
    "Hydra Dragon Cannelloni":1780,
    "Dragon Aquanini":3500,
    "Dragon Gingerini":3000,
    "Skibidi Toilet":7500,
    "Meowl":13000,
    "Strawbery Elephant":21000,
    "Jhon Pork":8000,
    "Antonio":4500

};


function renderShop(){

    const grid =
        document.getElementById(
            "shopGrid"
        );

    grid.innerHTML =
        Object.entries(ITEMS)
        .map(
            ([name,price]) => {

                return `
                <div class="card">

                    <div class="img">
                        🧠
                    </div>

                    <div>
                        ${name}
                    </div>

                    <div class="price">
                        ${price} 🧠
                    </div>

                    <button
                        class="buy"
                        onclick="buy('${name.replace(/'/g,"\\'")}')"
                    >
                        Купить
                    </button>

                </div>
                `;

            }
        )
        .join("");

}


async function buy(name){

    try{

        const data =
            await api(
                "/api/buy",
                {
                    method:"POST",

                    body:
                    JSON.stringify({
                        name:name
                    })
                }
            );

        if(!data.ok){

            alert(data.message);

            return;

        }

        balance =
            data.balance;

        await loadPlayer();

        alert(
            "✅ Куплено: " + name
        );

    }catch(error){

        alert(
            error.message
        );

    }

}


/* =====================================================
   DAILY
===================================================== */

async function dailyBonus(){

    try{

        const data =
            await api(
                "/api/daily",
                {
                    method:"POST"
                }
            );

        if(!data.ok){

            alert(
                data.message
            );

            return;

        }

        await loadPlayer();

        alert(
            "🎁 +3 🧠"
        );

    }catch(error){

        alert(
            error.message
        );

    }

}


/* =====================================================
   UPGRADE
===================================================== */

let selectedChance = 75;


function selectChance(
    element,
    chance
){

    document
        .querySelectorAll(".chance")
        .forEach(
            x =>
            x.classList
            .remove("active")
        );

    element.classList
        .add("active");

    selectedChance =
        chance;

    updateUpgradeCircle(
        chance
    );

}


function updateUpgradeCircle(
    percent
){

    const degrees =
        percent * 3.6;

    document
        .getElementById(
            "upgradeCircle"
        )
        .style
        .background =
        `
        conic-gradient(
            #00ff91 0deg,
            #00ff91 ${degrees}deg,
            #02050a ${degrees}deg,
            #02050a 360deg
        )
        `;

    document
        .getElementById(
            "upgradePercent"
        )
        .textContent =
        percent + "%";

}


async function upgrade(){

    const amount =
        Number(
            document
            .getElementById(
                "upgradeAmount"
            )
            .value
        );

    const msg =
        document
        .getElementById(
            "upgradeMsg"
        );

    if(!amount || amount <= 0){

        msg.textContent =
            "❌ Введи ставку.";

        return;

    }

    msg.textContent =
        "⚡ Проверяем...";

    try{

        const data =
            await api(
                "/api/upgrade",
                {
                    method:"POST",

                    body:
                    JSON.stringify({
                        chance:
                        selectedChance,

                        amount:
                        amount
                    })
                }
            );

        if(!data.ok){

            msg.textContent =
                data.message;

            return;

        }

        balance =
            data.balance;

        if(data.success){

            msg.textContent =
                "🟢 УСПЕХ! +"
                +
                amount
                +
                " 🧠";

        }else{

            msg.textContent =
                "🔴 Неудача.";

        }

        await loadPlayer();

    }catch(error){

        msg.textContent =
            error.message;

    }

}


/* =====================================================
   MINES
===================================================== */

let mineGame = false;

let mines = [];


function createMines(){

    const grid =
        document.getElementById(
            "minesGrid"
        );

    grid.innerHTML = "";

    mines = [];

    const bomb =
        Math.floor(
            Math.random() * 25
        );

    for(
        let i=0;
        i<25;
        i++
    ){

        const cell =
            document.createElement(
                "div"
            );

        cell.className =
            "mine";

        cell.textContent =
            "◇";

        cell.onclick =
            () => openMine(
                cell,
                i,
                bomb
            );

        grid.appendChild(
            cell
        );

    }

}


function startMines(){

    mineGame = true;

    document
        .getElementById(
            "minesMsg"
        )
        .textContent =
        "Выбирай клетки.";

    createMines();

}


function openMine(
    cell,
    index,
    bomb
){

    if(!mineGame)
        return;

    if(index === bomb){

        cell.textContent =
            "💣";

        cell.classList
            .add("bomb");

        mineGame =
            false;

        document
            .getElementById(
                "minesMsg"
            )
            .textContent =
            "💥 Мина!";

        return;

    }

    cell.textContent =
        "💎";

    cell.classList
        .add("open");

}


/* =====================================================
   DICE
===================================================== */

let selectedColor = "";


function selectColor(
    element,
    color
){

    document
        .querySelectorAll(
            ".color"
        )
        .forEach(
            x =>
            x.classList
            .remove("selected")
        );

    element
        .classList
        .add("selected");

    selectedColor =
        color;

}


function rollDice(){

    const colors = [
        "red",
        "orange",
        "yellow",
        "green",
        "blue",
        "purple"
    ];

    if(!selectedColor){

        alert(
            "Выбери цвет."
        );

        return;

    }

    const result =
        colors[
            Math.floor(
                Math.random()
                *
                colors.length
            )
        ];

    const msg =
        document
        .getElementById(
            "diceMsg"
        );

    if(result === selectedColor){

        msg.textContent =
            "🎉 Выпал твой цвет!";

    }else{

        msg.textContent =
            "❌ Выпал другой цвет: "
            +
            result;

    }

}


/* =====================================================
   SLOTS
===================================================== */

function spin(){

    const symbols = [
        "🍒",
        "🍋",
        "🍉",
        "⭐",
        "💎"
    ];

    const reels = [
        document.getElementById("r1"),
        document.getElementById("r2"),
        document.getElementById("r3")
    ];

    reels.forEach(
        reel => {

            reel.classList
                .remove("spin");

            void reel.offsetWidth;

            reel.classList
                .add("spin");

            reel.textContent =
                symbols[
                    Math.floor(
                        Math.random()
                        *
                        symbols.length
                    )
                ];

        }
    );

    document
        .getElementById(
            "slotMsg"
        )
        .textContent =
        "🎰 Готово!";

}


/* =====================================================
   TABS
===================================================== */

document
.querySelectorAll(".tab")
.forEach(
    tab => {

        tab.addEventListener(
            "click",
            () => {

                document
                .querySelectorAll(
                    ".tab"
                )
                .forEach(
                    x =>
                    x.classList
                    .remove("active")
                );

                document
                .querySelectorAll(
                    ".screen"
                )
                .forEach(
                    x =>
                    x.classList
                    .remove("active")
                );

                tab.classList
                    .add("active");

                document
                    .getElementById(
                        tab.dataset.screen
                    )
                    .classList
                    .add("active");

            }
        );

    }
);


/* =====================================================
   START
===================================================== */

renderShop();

updateUpgradeCircle(75);

loadPlayer();

</script>
