<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090611">
  <title>UPBRAINROTS — Mini App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="back-btn" id="backBtn">‹ <span>Назад</span></button>
      <div class="brand">
        <div class="brand-brain">🧠</div>
        <div><strong>UPBRAINROTS</strong><small>МИНИ-ПРИЛОЖЕНИЕ</small></div>
      </div>
      <button class="more-btn" id="moreBtn">•••</button>
    </header>

    <nav class="top-tabs">
      <button data-page="home" class="tab active"><span>⌂</span><b>ГЛАВНАЯ</b></button>
      <button data-page="games" class="tab"><span>🎮</span><b>ИГРЫ</b></button>
      <button data-page="balance" class="tab"><span>🧠</span><b>БАЛАНС</b></button>
      <button data-page="promo" class="tab"><span>🏷</span><b>ПРОМОКОД</b></button>
      <button data-page="profile" class="tab"><span>♙</span><b>ПРОФИЛЬ</b></button>
    </nav>

    <main id="view"></main>

    <nav class="bottom-nav">
      <button data-page="home" class="active"><span>⌂</span>Главная</button>
      <button data-page="games"><span>🎮</span>Игры</button>
      <button data-page="balance"><span>▣</span>Баланс</button>
      <button data-page="profile"><span>♙</span>Профиль</button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js"></script>
</body>
</html>
