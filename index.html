<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="version" content="TEST-123"
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPBRAINROTS</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#1a0933,#09090f);
color:white;
padding:16px;
}
.container{max-width:480px;margin:auto;}
.header{
background:rgba(255,255,255,0.06);
border-radius:24px;
padding:20px;
text-align:center;
margin-bottom:20px;
}
.title{font-size:28px;font-weight:900;}
.balance{font-size:36px;font-weight:900;color:#ffd166;margin:10px 0;}
button{
width:100%;
padding:14px;
border:none;
border-radius:16px;
font-size:17px;
font-weight:800;
cursor:pointer;
margin-top:10px;
}
.bonus{background:#ff7b00;color:white;}
.card{
background:rgba(255,255,255,0.06);
border-radius:24px;
padding:18px;
margin-bottom:18px;
}
.slot-row{display:flex;justify-content:center;gap:10px;margin:18px 0;}
.slot{
width:72px;height:72px;
background:white;color:black;
border-radius:16px;
display:flex;align-items:center;justify-content:center;
font-size:40px;font-weight:bold;
}
.purple{background:#8b5cf6;color:white;}
.green{background:#22c55e;color:#061b0c;}
.blue{background:#2563eb;color:white;}
.info{color:#cfcfe6;font-size:14px;margin-top:8px;}
.msg{margin-top:12px;min-height:22px;font-weight:700;text-align:center;}
.jackpot{text-align:center;font-size:30px;font-weight:900;color:#ffd166;margin:12px 0;}
</style>
</head>

<body>
<div class="container">

<div class="header">
<div class="title">🤖 UPBRAINROTS</div>
<div class="balance"><span id="balance">0</span> 🪙</div>
<button class="bonus" onclick="getBonus()">🎁 Получить 30 🪙</button>
<div class="info">Бонус каждые 10 секунд</div>
</div>

<div class="card">
<h2>🎰 Слоты</h2>
<div class="slot-row">
<div class="slot" id="s1">🍒</div>
<div class="slot" id="s2">🍋</div>
<div class="slot" id="s3">🍉</div>
</div>
<div class="info">Ставка: 15 🪙</div>
<button class="purple" onclick="spinSlots()">🎰 Крутить</button>
<div class="msg" id="slotMsg"></div>
</div>

<div class="card">
<h2>⚡ Апгрейдер</h2>
<div class="info">Заплати 20 🪙 и попробуй удвоить монеты</div>
<button class="green" onclick="upgradeCoins()">⚡ Апгрейд</button>
<div class="msg" id="upMsg"></div>
</div>

<div class="card">
<h2>💰 Джекпот</h2>
<div class="jackpot"><span id="jackpot">500</span> 🪙</div>
<div class="info">Билет: 25 🪙. Шанс 20%</div>
<button class="blue" onclick="playJackpot()">💰 Играть</button>
<div class="msg" id="jackMsg"></div>
</div>

</div>

<script>
alert("JS РАБОТАЕТ)";
let balance=Number(localStorage.getItem("up_balance"))||100;
let jackpot=Number(localStorage.getItem("up_jackpot"))||500;
let lastBonus=Number(localStorage.getItem("up_last_bonus"))||0;

function save(){
localStorage.setItem("up_balance",balance);
localStorage.setItem("up_jackpot",jackpot);
localStorage.setItem("up_last_bonus",lastBonus);
}

function update(){
document.getElementById("balance").textContent=balance;
document.getElementById("jackpot").textContent=jackpot;
save();
}

function getBonus(){
const now=Date.now();
if(now-lastBonus<10000){
alert("⏳ Подожди несколько секунд");
return;
}
balance+=30;
lastBonus=now;
update();
alert("🎁 +30 🪙");
}

function spinSlots(){
if(balance<15){
document.getElementById("slotMsg").textContent="❌ Недостаточно монет";
return;
}
balance-=15;
const arr=["🍒","🍋","🍉","⭐","💎"];
const a=arr[Math.floor(Math.random()*arr.length)];
const b=arr[Math.floor(Math.random()*arr.length)];
const c=arr[Math.floor(Math.random()*arr.length)];
document.getElementById("s1").textContent=a;
document.getElementById("s2").textContent=b;
document.getElementById("s3").textContent=c;
let win=0;
if(a===b&&b===c){
win=150;
document.getElementById("slotMsg").textContent="🎉 Джекпот +150 🪙";
}else if(a===b||b===c||a===c){
win=45;
document.getElementById("slotMsg").textContent="🔥 Два совпадения +45 🪙";
}else{
document.getElementById("slotMsg").textContent="😢 Проигрыш -15 🪙";
}
balance+=win;
update();
}

function upgradeCoins(){
if(balance<20){
document.getElementById("upMsg").textContent="❌ Нужно 20 🪙";
return;
}
balance-=20;
if(Math.random()<0.55)
{balance+=40;
document.getElementById("upMsg").textContent="⚡ Успех +40 🪙";
}else{
document.getElementById("upMsg").textContent="💥 Неудача -20 🪙";
}
update();
}

function playJackpot(){
if(balance<25){
document.getElementById("jackMsg").textContent="❌ Нужно 25 🪙";
return;
}
balance-=25;
jackpot+=25;
if(Math.random()<0.2){
balance+=jackpot;
document.getElementById("jackMsg").textContent="🏆 Ты сорвал джекпот!";
jackpot=500;
}else{
document.getElementById("jackMsg").textContent="😢 Не повезло";
}
update();
}

update();
